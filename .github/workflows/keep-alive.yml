name: Keep backend warm

# Render's free tier spins the service down after 15 minutes of no
# inbound requests, and the next request pays a cold-start penalty
# (container boot + a `prisma migrate deploy` no-op check). Pinging
# /health more often than that keeps it warm for anyone clicking the
# resume link. Free tier gives 750 instance-hours/month per service,
# which a single always-on service fits inside anyway.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the health endpoint
        env:
          # Repo variable, set once the Render service exists:
          # Settings -> Secrets and variables -> Actions -> Variables ->
          # RENDER_APP_URL = https://<service-name>.onrender.com
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "RENDER_APP_URL not set yet -- skipping"
            exit 0
          fi
          curl -fsS "$RENDER_APP_URL/health"
